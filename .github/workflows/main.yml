name: Full-Stack QA Capstone CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd api_testing
          pip install -r requirements.txt
          pytest tests/ -v --junitxml=reports/api-results.xml
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: |
          cd ui_automation
          mvn clean test
